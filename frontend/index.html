<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kartei" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // theme before the first paint (see src/lib/theme.svelte.ts)
      try {
        const v = localStorage.getItem('kartei:theme')
        if (v) document.documentElement.dataset.theme = v
        const dark = v === 'dark' || (!v && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17171b' : '#ffffff'
      } catch {}
    </script>
    <title>Kartei</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kartei
          POSTGRES_USER: kartei
          POSTGRES_PASSWORD: kartei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kartei -d kartei" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://kartei:kartei@localhost:5432/kartei' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for python-ldap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap-dev libsasl2-dev
      - run: pip install -r requirements.txt
      - name: Migrations are complete
        run: |
          python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.relay_settings python manage.py makemigrations --check --dry-run
      - run: python manage.py test kartei relay

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-26.04
    env:
      DEBUG: "1"
      EXPORT_ROOT: /tmp/export
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries for python-ldap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap-dev libsasl2-dev
      - run: pip install -r backend/requirements.txt
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Start Kartei with sample data
        working-directory: backend
        run: |
          python manage.py migrate -v0
          ADMIN_USERNAME=admin ADMIN_PASSWORD=admin12345 python manage.py init_app
          python manage.py seed_demo --password demo12345
          python manage.py runserver 127.0.0.1:8000 --noreload > ../server.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/session > /dev/null
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE: http://127.0.0.1:8000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            server.log

  upgrade:
    name: Upgrade from the latest release
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kartei
          POSTGRES_USER: kartei
          POSTGRES_PASSWORD: kartei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kartei -d kartei" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kartei:kartei@127.0.0.1:5432/kartei
      SECRET_KEY: upgrade-test-only-not-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Latest release with sample data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')
          echo "Upgrading from $version"
          docker run -d --name old --network host -e SECRET_KEY -e DATABASE_URL -e ALLOWED_HOSTS -e SECURE_COOKIES=0 \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=admin12345 "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kartei:$version" \
            sh -c "python manage.py migrate --noinput -v0 && python manage.py init_app && exec gunicorn config.wsgi -b 127.0.0.1:8009"
          curl -sf --retry 60 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8009/api/session
          docker exec old python manage.py seed_demo --password demo12345
          docker exec -i old python manage.py shell < .github/upgrade-fingerprint.py | grep FINGERPRINT > before.txt
          docker rm -f old
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for python-ldap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap-dev libsasl2-dev
      - run: pip install -r backend/requirements.txt
      - name: Migrate with this version; the data must be unchanged and usable
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py shell < ../.github/upgrade-fingerprint.py | grep FINGERPRINT > ../after.txt
          diff ../before.txt ../after.txt
          ADMIN_USERNAME=admin ADMIN_PASSWORD=admin12345 python manage.py init_app
          python manage.py shell < ../.github/upgrade-smoke.py

  docker:
    name: Docker image
    runs-on: ubuntu-26.04
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write   # vulnerability reports in the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kartei:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Relay image (DMZ)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: relay
          push: false
          tags: kartei-relay:ci
          load: true
          cache-from: type=gha
      # software bills of materials (SPDX and CycloneDX) for the source tree and both images, kept as a build artifact
      - run: mkdir sbom
      - { uses: anchore/sbom-action@v0, with: { path: ., format: spdx-json, output-file: sbom/kartei-source.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { path: ., format: cyclonedx-json, output-file: sbom/kartei-source.cdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei:ci, format: spdx-json, output-file: sbom/kartei-image.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei:ci, format: cyclonedx-json, output-file: sbom/kartei-image.cdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei-relay:ci, format: spdx-json, output-file: sbom/kartei-relay-image.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei-relay:ci, format: cyclonedx-json, output-file: sbom/kartei-relay-image.cdx.json, upload-artifact: false } }
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
      # known vulnerabilities (Grype): reported in Security → Code scanning; fails only for critical ones that have a fix
      - id: scan
        uses: anchore/scan-action@v7
        with:
          image: kartei:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
          output-file: kartei.sarif
      - id: scan-relay
        if: always()
        uses: anchore/scan-action@v7
        with:
          image: kartei-relay:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
          output-file: kartei-relay.sarif
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kartei.sarif
          category: image-kartei
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kartei-relay.sarif
          category: image-kartei-relay

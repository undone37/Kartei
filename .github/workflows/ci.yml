name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kartei
          POSTGRES_USER: kartei
          POSTGRES_PASSWORD: kartei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kartei -d kartei" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://kartei:kartei@localhost:5432/kartei' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for python-ldap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev
      - run: pip install -r requirements.txt
      - name: Migrations are complete
        run: |
          python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.relay_settings python manage.py makemigrations --check --dry-run
      - run: python manage.py test kartei relay

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kartei:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Relay image (DMZ)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: relay
          push: false
          tags: kartei-relay:ci
          load: true
          cache-from: type=gha
      # software bills of materials (SPDX and CycloneDX) for the source tree and both images, kept as a build artifact
      - run: mkdir sbom
      - { uses: anchore/sbom-action@v0, with: { path: ., format: spdx-json, output-file: sbom/kartei-source.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { path: ., format: cyclonedx-json, output-file: sbom/kartei-source.cdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei:ci, format: spdx-json, output-file: sbom/kartei-image.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei:ci, format: cyclonedx-json, output-file: sbom/kartei-image.cdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei-relay:ci, format: spdx-json, output-file: sbom/kartei-relay-image.spdx.json, upload-artifact: false } }
      - { uses: anchore/sbom-action@v0, with: { image: kartei-relay:ci, format: cyclonedx-json, output-file: sbom/kartei-relay-image.cdx.json, upload-artifact: false } }
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

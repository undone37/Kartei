# Release (images for linux/amd64 and linux/arm64): push a tag like v1.2.3 (or v1.2.3-beta: a pre-release, without the 1.2 / 1 image tags). Publishes both images to the GitHub container registry and creates the
# GitHub release with the manuals as PDF, openapi.yaml and SBOMs (SPDX, CycloneDX) for the source tree and both images.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4: arm64 images are built under emulation
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kartei
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: KARTEI_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: relay
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kartei-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          target: relay
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: KARTEI_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.relay.outputs.tags }}
          labels: ${{ steps.relay.outputs.labels }}
          sbom: true
          provenance: mode=max

      - run: mkdir dist && cp docs/openapi.yaml dist/   # REST API description as a release asset
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { path: ., format: spdx-json, output-file: "dist/kartei-${{ env.VERSION }}-source.spdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { path: ., format: cyclonedx-json, output-file: "dist/kartei-${{ env.VERSION }}-source.cdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { image: "${{ fromJSON(steps.meta.outputs.json).tags[0] }}", format: spdx-json, output-file: "dist/kartei-${{ env.VERSION }}-image.spdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { image: "${{ fromJSON(steps.meta.outputs.json).tags[0] }}", format: cyclonedx-json, output-file: "dist/kartei-${{ env.VERSION }}-image.cdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { image: "${{ fromJSON(steps.relay.outputs.json).tags[0] }}", format: spdx-json, output-file: "dist/kartei-relay-${{ env.VERSION }}-image.spdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3
      - { uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c, with: { image: "${{ fromJSON(steps.relay.outputs.json).tags[0] }}", format: cyclonedx-json, output-file: "dist/kartei-relay-${{ env.VERSION }}-image.cdx.json", upload-artifact: false } }  # v0.24.3: v0.24.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Manuals as PDF
        working-directory: frontend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc poppler-utils fonts-noto-core fonts-dejavu-core
          npm ci
          npx playwright install --with-deps chromium
          node scripts/manuals-pdf.mjs --out ../dist --version "$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the version's section of CHANGELOG.md, followed by GitHub's generated notes (empty section: generated notes only)
          awk -v v="## [${VERSION#v}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes --notes-file notes.md \
            --title "Kartei ${VERSION#v}" $([[ $VERSION == *-* ]] && echo --prerelease)
          gh release upload "$VERSION" dist/* --clobber
